<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruckManager — Fleet &amp; Cross-Border Trip Console</title>
<meta name="description" content="TruckManager keeps every truck, trip, and invoice in one place — cross-border trip tracking, expenses, subcontractor commission, and payments, synced live across your team." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="theme-color" content="#2563EB" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="landing-root"></div>
<div id="auth-root" style="display:none;"></div>
<div id="pending-root" style="display:none;"></div>

<div id="app-root" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="1" y="7" width="14" height="9"/><path d="M15 11h4l3 3v2h-7"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
      <div><div class="name">TruckManager</div><div class="tag">Fleet &amp; Cross-Border Ops</div></div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-foot" id="sidebarFoot">All figures shown in USD ($)
      <div><button class="logout-btn" id="logoutBtn">Log Out</button></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-profile" onclick="setRoute('settings')" title="Settings">
        <span class="topbar-username" id="topbarUserName">—</span>
        <div class="avatar" id="topAvatar">—</div>
      </div>
    </div>
    <div class="view" id="app"></div>
  </div>
</div>

<div id="invoice-overlay" style="display:none;"></div>
<div id="invoice-print-frame" style="display:none;"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
